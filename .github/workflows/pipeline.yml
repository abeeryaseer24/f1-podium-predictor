name: Race pipeline

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours, at minute 17 (UTC)
  workflow_dispatch:          # adds a "Run workflow" button for manual runs

permissions:
  contents: write             # allows this job to push the updated files

concurrency:
  group: race-pipeline        # never run two at the same time
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install libraries
        run: pip install -r requirements.txt matplotlib

      - name: Run the pipeline
        run: python src/pipeline.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Save changes to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data models reports
          if git diff --cached --quiet; then
            echo "Nothing changed, nothing to save."
          else
            git commit -m "Pipeline update $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi