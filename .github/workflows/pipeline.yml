name: Race pipeline

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours, at minute 17 (UTC)
  workflow_dispatch:          # adds a "Run workflow" button for manual runs

permissions:
  contents: write             # allows this job to push the updated files

concurrency:
  group: race-pipeline        # never run two at the same time
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45          # the prediction is pushed first; the radio steps after it have their own limits
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install libraries
        run: pip install -r requirements.txt matplotlib

      - name: Run the pipeline
        run: python src/pipeline.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Save changes to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data models reports
          if git diff --cached --quiet; then
            echo "Nothing changed, nothing to save."
          else
            git commit -m "Pipeline update $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi

      # ---- Team radio transcripts: only AFTER the prediction above has been pushed. ----
      # Every step below is optional and time-limited, so it can never delay or undo the
      # locked-in prediction. If anything fails, the transcripts just wait for a later run.
      - name: Install radio transcription
        continue-on-error: true
        timeout-minutes: 4
        run: pip install faster-whisper "av<16"

      - name: Transcribe team radio
        continue-on-error: true
        timeout-minutes: 6
        run: python src/team_radio.py --missing --limit 3

      - name: Save radio transcripts
        continue-on-error: true
        timeout-minutes: 2
        run: |
          git add data/races/*/team_radio.parquet || true
          if git diff --cached --quiet; then
            echo "No new transcripts."
          else
            git commit -m "Team radio transcripts $(date -u '+%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi

      # ---- Driving styles for Guess the Driver: optional, after everything above. ----
      - name: Measure driving styles of new races
        continue-on-error: true
        timeout-minutes: 8
        run: python src/driving_style.py --missing --limit 2 --train

      - name: Let the AI driver drive new circuits
        continue-on-error: true
        timeout-minutes: 4
        run: python src/ai_driver.py --missing

      - name: Save driving styles
        continue-on-error: true
        timeout-minutes: 2
        run: |
          git add data/processed/style data/processed/style_model.json data/processed/style_game.parquet data/processed/ai_driver || true
          if git diff --cached --quiet; then
            echo "No new driving styles."
          else
            git commit -m "Driving styles $(date -u '+%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
